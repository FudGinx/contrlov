<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ОДНА БУКВА</title><style>
:root{font-family:system-ui,sans-serif;color:#fff;background:#100d26}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% 0%,#6b2188 0,transparent 45%),radial-gradient(ellipse at 0% 80%,#25488e 0,transparent 45%),#100d26}main{max-width:520px;margin:auto;padding:24px 18px 60px}h1{font-size:clamp(42px,12vw,68px);line-height:.93;letter-spacing:-3px;margin:24px 0 8px;text-shadow:5px 6px #f83e8d}h1 span{color:#d9ff45}p{color:#c9c3e2}.panel{background:#ffffff10;border:1px solid #ffffff25;border-radius:24px;padding:20px;margin:18px 0;box-shadow:0 12px 40px #0003}input,select{width:100%;background:#1f1b3d;border:1px solid #696184;border-radius:14px;color:white;padding:14px;font:inherit;margin:7px 0 12px}button{cursor:pointer;border:0;border-radius:14px;padding:15px 18px;font-weight:900;font-size:16px;background:#d9ff45;color:#17122a;box-shadow:0 5px 0 #8aab23;margin:5px 0}button:active{transform:translateY(3px);box-shadow:0 2px 0 #8aab23}button.secondary{background:#ff4c9b;box-shadow:0 5px 0 #ac2660;color:white}button.ghost{background:#ffffff20;color:white;box-shadow:none}.wide{width:100%}.tag{display:inline-block;padding:7px 12px;background:#ff4c9b;border-radius:99px;font-weight:900}.word{font-size:clamp(36px,10vw,60px);font-weight:1000;word-break:break-word;text-align:center;margin:20px 0;color:#d9ff45}.letter{font-size:90px;font-weight:1000;text-align:center;color:#ff4c9b;line-height:1.2}.hint{display:inline-block;background:#ffffff20;border-radius:99px;padding:9px 13px;margin:5px}.player{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff25;padding:12px 0}.muted{font-size:13px;color:#bdb5d3}.hide{display:none}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#ff4c9b;padding:12px 20px;border-radius:12px;display:none;max-width:90vw}label{font-size:13px;font-weight:800;color:#d7d0ee}#timer{text-align:center;font-size:48px;font-weight:900}header{display:flex;align-items:center;justify-content:space-between}.shine{animation:pulse 2s infinite alternate}@keyframes pulse{to{filter:drop-shadow(0 0 15px #ff4c9b)}} </style></head><body><main><header><b>✦ PARTY LAB</b><span class="tag">🎤 1 БУКВА</span></header><h1>ОДНА<br><span>БУКВА!</span></h1><p>Объясни любое слово, используя слова только на одну букву. Сможешь?</p>
<section id="home" class="panel"><label>ТВОЁ ИМЯ</label><input id="name" placeholder="Например, Капитан П" maxlength="24"><button id="create" class="wide">⚡ СОЗДАТЬ КОМНАТУ</button><label>ИЛИ КОД КОМНАТЫ</label><input id="joincode" placeholder="ABCDE" maxlength="5" style="text-transform:uppercase"><button id="join" class="wide secondary">ПОДКЛЮЧИТЬСЯ</button></section>
<section id="game" class="hide"><div class="panel"><div class="muted">КОМНАТА</div><div class="word" id="roomcode"></div><button class="ghost wide" id="share">🔗 ПОДЕЛИТЬСЯ ССЫЛКОЙ</button><div id="players"></div></div>
<div id="setup" class="panel hide"><h2>🎲 Новый раунд</h2><label>СЛОВО</label><input id="customword" placeholder="Пусто = случайное"><label>БУКВА</label><select id="letter"><option value="">🎲 Случайная буква</option></select><label>КТО ОБЪЯСНЯЕТ</label><select id="speaker"></select><label>ВРЕМЯ</label><select id="seconds"><option value="60">60 секунд</option><option value="90" selected>90 секунд</option><option value="120">120 секунд</option></select><button id="start" class="wide">🚀 НАЧАТЬ РАУНД</button></div>
<div id="round" class="panel hide"><div class="muted" id="speakername"></div><div class="letter" id="roundletter"></div><div class="muted" style="text-align:center">ВСЕ СЛОВА ТОЛЬКО НА ЭТУ БУКВУ</div><div id="timer"></div><div id="secret" class="hide"><div class="word" id="secretword"></div><button id="hintbutton" class="ghost wide" type="button">💡 ПОКАЗАТЬ ПОДСКАЗКИ</button><div id="hintbox" class="hide"><div class="muted">ПОДСКАЗКИ</div><div id="hints"></div></div></div><div id="waiting" style="text-align:center;margin:20px">🤫 Секретное слово видит только объясняющий</div><div id="controls" class="hide"><label>КТО УГАДАЛ?</label><select id="winner"></select><button id="finish" class="wide secondary">🏆 ЗАВЕРШИТЬ РАУНД</button></div></div><div id="history" class="panel hide"></div></section><p class="muted" style="text-align:center">Словарь 20 000+ существительных · Простые буквы · Онлайн-комнаты</p></main><div id="toast"></div><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),s=io(),letters='АБВГДКЛМНОПРСТУ';for(const l of letters){const o=document.createElement('option');o.value=l;o.textContent=l;$('letter').append(o)}let id=localStorage.pid||'',room=null,secret=null;let hintsShown=false;$('hintbutton').onclick=()=>{hintsShown=!hintsShown;if(hintsShown){$('hints').textContent='🔎 Ищу связи в Википедии...';s.emit('hints',{},r=>r?.error&&toast(r.error))}$('hintbox').classList.toggle('hide',!hintsShown);$('hintbutton').textContent=hintsShown?'🙈 СКРЫТЬ ПОДСКАЗКИ':'💡 ПОКАЗАТЬ ПОДСКАЗКИ'};const params=new URLSearchParams(location.search);if(params.get('room'))$('joincode').value=params.get('room');$('name').value=localStorage.nickname||'';
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2800)}
function join(code){const name=$('name').value.trim()||'Игрок';localStorage.nickname=name;s.emit('join',{room:code,name,playerId:id},r=>{if(r.error)return toast(r.error);id=r.id;localStorage.pid=id;history.replaceState(null,'','?room='+r.code);$('home').classList.add('hide');$('game').classList.remove('hide');toast('Ты в игре!')})}
$('create').onclick=()=>join('');$('join').onclick=()=>join($('joincode').value.trim().toUpperCase());$('share').onclick=async()=>{const url=location.origin+'/?room='+room.code;try{await navigator.clipboard.writeText(url);toast('Ссылка скопирована!')}catch{prompt('Скопируй ссылку:',url)}};
$('start').onclick=()=>{s.emit('start',{word:$('customword').value,letter:$('letter').value,speaker:$('speaker').value,seconds:+$('seconds').value},r=>r.error&&toast(r.error))};
$('finish').onclick=()=>s.emit('finish',{winner:$('winner').value},r=>r.error&&toast(r.error));
function option(select,value,label){const o=document.createElement('option');o.value=value;o.textContent=label;select.append(o)}
function draw(){if(!room)return;$('roomcode').textContent=room.code;$('players').replaceChildren();for(const p of room.players){const d=document.createElement('div');d.className='player';d.textContent=(p.online?'🟢 ':'⚪ ')+p.name+(p.id===room.host?' 👑':'')+' — '+p.score+' ⭐';$('players').append(d)}
$('setup').classList.toggle('hide',room.host!==id||!!(room.round&&!room.round.done));$('speaker').replaceChildren();$('winner').replaceChildren();option($('winner'),'','Никто не угадал');for(const p of room.players){option($('speaker'),p.id,p.name);if(p.id!==room.round?.speaker)option($('winner'),p.id,p.name)}
const r=room.round;$('round').classList.toggle('hide',!r);if(r){$('roundletter').textContent=r.letter;$('speakername').textContent='ОБЪЯСНЯЕТ: '+(room.players.find(p=>p.id===r.speaker)?.name||'Игрок');const allowed=id===r.speaker||id===room.host;$('controls').classList.toggle('hide',!allowed||r.done);$('secret').classList.toggle('hide',!secret&&!r.done);$('waiting').classList.toggle('hide',!!secret||r.done);if(r.done){$('secretword').textContent=r.word;$('secret').classList.remove('hide');$('waiting').classList.add('hide')}else if(allowed){s.emit('reveal',{},()=>{})}else{$('secret').classList.add('hide')}}
$('history').classList.toggle('hide',!room.history.length);$('history').replaceChildren();if(room.history.length){const h=document.createElement('h3');h.textContent='🏅 История';$('history').append(h);for(const e of [...room.history].reverse()){const d=document.createElement('div');d.className='player';d.textContent=e.word+' / '+e.letter+' — '+e.winner;$('history').append(d)}}}
s.on('room',r=>{if(room?.round?.started!==r.round?.started)secret=null;hintsShown=false;$('hintbox').classList.add('hide');$('hintbutton').textContent='💡 ПОКАЗАТЬ ПОДСКАЗКИ';room=r;draw()});
s.on('hintResult',d=>{if(!hintsShown)return;$('hints').replaceChildren();if(d.loading){$('hints').textContent='🔎 Проверяю статью и связанные материалы...';return}for(const h of d.hints){const e=document.createElement('span');e.className='hint';e.textContent=h;$('hints').append(e)}if(!d.hints.length)$('hints').textContent='Не нашёл надёжных связей на эту букву.'});s.on('secret',d=>{secret=d;$('secretword').textContent=d.word;$('hints').replaceChildren();for(const h of d.hints){const e=document.createElement('span');e.className='hint';e.textContent=h;$('hints').append(e)}if(!d.hints.length)$('hints').textContent=d.loading?'🔎 Ищу смысловые связи...':'Подходящие смысловые связи не найдены. Попробуй другую букву.';drawSecret()});
function drawSecret(){if(room?.round&&!room.round.done){$('secret').classList.remove('hide');$('waiting').classList.add('hide')}}
setInterval(()=>{const r=room?.round;if(!r)return;$('timer').textContent=r.done?'🏁 ФИНИШ':Math.max(0,Math.ceil(r.seconds-(Date.now()-r.started)/1000))+' сек'},250);
s.on('connect',()=>{if(room)join(room.code)});
</script></body></html>
