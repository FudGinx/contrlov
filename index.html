<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КонтрЛов</title>
    <style>
        body { font-family: Arial, sans-serif; margin:0; padding:0; background:#1e1e1e; color:#fff; text-align:center; }
        .screen { display:none; padding:20px; max-width:500px; margin:0 auto; }
        .active { display:block; }
        .button-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 15px 0; }
        button { 
            background:#333; color:white; border:none; padding:14px 20px; 
            border-radius:12px; font-size:18px; cursor:pointer; 
            min-width:90px; white-space:nowrap; transition:all 0.2s;
        }
        button:hover { background:#555; }
        button.active { background:#ff00aa; box-shadow:0 0 15px #ff00aa; }
        .pink { background:#ff00aa !important; color:white; }
        .blue { background:#00ccff !important; color:#000; }
        .restart-btn { background:#ff8800; padding:14px 30px; font-size:18px; margin:15px 0; }
        .confirm-box { 
            background:#333; padding:25px; border-radius:16px; margin:30px auto; max-width:400px;
        }
        .word { font-size:21px; background:#444; padding:10px 14px; margin:6px; border-radius:10px; display:inline-block; }
        #timer { font-size:58px; font-weight:bold; margin:20px 0; color:#ff3366; }
        .score { font-size:24px; margin:15px 0; font-weight:bold; }
    </style>
</head>
<body>

<!-- НАСТРОЙКИ -->
<div id="screen-setup" class="screen active">
    <h1>КонтрЛов</h1>
    
    <select id="lang" style="padding:12px; font-size:18px; margin:15px 0; width:85%;">
        <option value="ru">Русский</option>
        <option value="ua">Українська</option>
    </select>

    <div style="margin:20px 0;">
        <h3 id="team1-label">Команда 1 (розовая)</h3>
        <input id="team1" value="Команда 1" style="padding:12px; width:85%; font-size:18px; text-align:center;">
    </div>
    <div style="margin:20px 0;">
        <h3 id="team2-label">Команда 2 (голубая)</h3>
        <input id="team2" value="Команда 2" style="padding:12px; width:85%; font-size:18px; text-align:center;">
    </div>

    <p id="words-label">Слов в истории:</p>
    <div id="words-buttons" class="button-group">
        <button onclick="setWords(3)" class="active">3</button>
        <button onclick="setWords(4)">4</button>
        <button onclick="setWords(5)">5</button>
    </div>

    <p id="rounds-label">Кругов в каждом раунде:</p>
    <div id="rounds-buttons" class="button-group">
        <button onclick="setRounds(1)">1</button>
        <button onclick="setRounds(2)" class="active">2</button>
        <button onclick="setRounds(3)">3</button>
        <button onclick="setRounds(4)">4</button>
        <button onclick="setRounds(5)">5</button>
    </div>

    <p id="difficulty-label">Сложность:</p>
    <div id="difficulty-buttons" class="button-group">
        <button onclick="setDifficulty('easy')" class="active">Простая</button>
        <button onclick="setDifficulty('medium')">Средняя</button>
        <button onclick="setDifficulty('hard')">Сложная</button>
    </div>

    <br>
    <button onclick="startGame()" id="start-btn" style="font-size:24px; padding:18px 50px; background:#ff00aa;">Погнали!</button>
</div>

<!-- ИГРА (здесь кнопка перезапуска) -->
<div id="screen-game" class="screen">
    <h2 id="round-name" style="color:#ff00aa;"></h2>
    <p id="round-desc"></p>
    
    <div class="score">
        <span id="score1" class="pink">Команда 1: 0</span> | 
        <span id="score2" class="blue">Команда 2: 0</span>
    </div>

    <h3 id="current-team" style="margin:25px 0; font-size:26px;"></h3>
    
    <div id="theme-or-product" style="font-size:22px; background:#333; padding:20px; border-radius:14px; min-height:90px; margin:15px 0;"></div>
    
    <div id="secret-words" style="margin:25px 0;"></div>
    
    <button onclick="startTimer()" style="background:#00ccff; padding:16px 40px; font-size:19px;">Начать рассказ (2 мин)</button>
    <div id="timer">2:00</div>
    
    <button onclick="endRound()" style="background:#ff00aa; padding:16px 40px;">Закончить раунд</button>
    
    <!-- Кнопка перезапуска внутри раунда -->
    <button onclick="showRestartConfirm()" class="restart-btn">Перезапустить игру</button>
</div>

<!-- ПОДТВЕРЖДЕНИЕ ПЕРЕЗАПУСКА -->
<div id="restart-confirm" class="screen">
    <div class="confirm-box">
        <h2>Вы действительно хотите перезапустить игру?</h2>
        <p style="color:#ff8888; margin:20px 0;">Весь прогресс будет потерян</p>
        <button onclick="restartGame()" style="background:#ff4444; padding:16px 40px; margin:10px;">Да, перезапустить</button>
        <button onclick="hideRestartConfirm()" style="background:#666; padding:16px 40px; margin:10px;">Нет, продолжить</button>
    </div>
</div>

<!-- УГАДЫВАНИЕ -->
<div id="screen-guess" class="screen">
    <h2 id="guess-title">Сколько слов угадала команда соперника?</h2>
    <div id="guess-buttons" style="margin:30px 0; font-size:28px;"></div>
    <button onclick="nextAfterGuess()" style="padding:16px 50px; background:#00ff88;">Далее</button>
</div>

<!-- ИТОГИ -->
<div id="screen-end" class="screen">
    <h1>Игра окончена!</h1>
    <div class="score" style="font-size:28px; margin:30px 0;">
        <span id="final-score1" class="pink"></span><br>
        <span id="final-score2" class="blue"></span>
    </div>
    <h2 id="winner" style="color:#00ff99;"></h2>
    <button onclick="restartGame()" style="background:#ff8800; padding:18px 50px; font-size:22px; margin:20px;">Перезапустить игру</button>
    <button onclick="goToMenu()" style="background:#666; padding:14px 40px;">Вернуться в меню</button>
</div>

// ==================== ГЕНЕРАЦИЯ СЛОВ ====================
function getRandomWord(level, lists) {
    const rand = Math.random();
    if (level === 'easy') return rand < 0.95 ? lists.easy[Math.floor(Math.random()*lists.easy.length)] : lists.medium[Math.floor(Math.random()*lists.medium.length)];
    if (level === 'medium') {
        if (rand < 0.90) return lists.medium[Math.floor(Math.random()*lists.medium.length)];
        if (rand < 0.95) return lists.easy[Math.floor(Math.random()*lists.easy.length)];
        return lists.hard[Math.floor(Math.random()*lists.hard.length)];
    }
    if (rand < 0.60) return lists.hard[Math.floor(Math.random()*lists.hard.length)];
    if (rand < 0.90) return lists.medium[Math.floor(Math.random()*lists.medium.length)];
    return lists.easy[Math.floor(Math.random()*lists.easy.length)];
}

function generateSecretWords(count, level, lists) {
    return Array.from({length: count}, () => getRandomWord(level, lists));
}

function updateActive(containerId, value) {
    const buttons = document.getElementById(containerId).querySelectorAll('button');
    buttons.forEach(btn => btn.classList.toggle('active', btn.innerText == value));
}

function setWords(n) { wordsCount = n; updateActive('words-buttons', n); }
function setRounds(n) { totalRoundsPerType = n; updateActive('rounds-buttons', n); }
function setDifficulty(d) {
    difficulty = d;
    const btns = document.querySelectorAll('#difficulty-buttons button');
    btns.forEach(b => b.classList.remove('active'));
    event.currentTarget.classList.add('active');
}

function startGame() {
    lang = document.getElementById('lang').value;
    teams[0] = document.getElementById('team1').value.trim() || "Команда 1";
    teams[1] = document.getElementById('team2').value.trim() || "Команда 2";
    scores = [0, 0];
    currentRoundType = 1;
    currentCircle = 1;
    currentTeamIndex = 0;

    document.getElementById('screen-setup').classList.remove('active');
    document.getElementById('screen-game').classList.add('active');
    nextRound();
}

function showRestartConfirm() {
    document.getElementById('restart-confirm').classList.add('active');
}

function hideRestartConfirm() {
    document.getElementById('restart-confirm').classList.remove('active');
}

function restartGame() {
    location.reload();
}

    let title = '', desc = '', content = '';

    if (currentRoundType === 1) {
        title = lang === 'ru' ? 'Раунд 1: История по теме' : 'Раунд 1: Історія за темою';
        desc = lang === 'ru' ? 'Вставь секретные слова в историю' : 'Встав секретні слова в історію';
        content = `<strong>Тема:</strong><br>${d.themes[Math.floor(Math.random() * d.themes.length)]}`;
    } else if (currentRoundType === 2) {
        title = lang === 'ru' ? 'Раунд 2: Рекламный питч' : 'Раунд 2: Рекламний пітч';
        desc = lang === 'ru' ? 'Продай продукт, вставив слова' : 'Продай продукт, вставив слова';
        content = `<strong>Продукт:</strong><br>${d.products[Math.floor(Math.random() * d.products.length)]}`;
    } else {
        title = lang === 'ru' ? 'Раунд 3: Пересказ' : 'Раунд 3: Переказ';
        desc = lang === 'ru' ? 'Пересказывай что угодно' : 'Переказуй що завгодно';
        content = `<strong>Пересказывай:</strong><br>фильм, сказку, книгу...`;
    }

    document.getElementById('round-name').innerText = title;
    document.getElementById('round-desc').innerText = desc;
    document.getElementById('theme-or-product').innerHTML = content;

    secretWords = generateSecretWords(wordsCount, difficulty, d.words);

    let html = `<strong>${lang === 'ru' ? 'Твои секретные слова:' : 'Твої секретні слова:'}</strong><br>`;
    secretWords.forEach(w => html += `<span class="word">${w}</span> `);
    document.getElementById('secret-words').innerHTML = html;

    document.getElementById('score1').innerText = `${teams[0]}: ${scores[0]}`;
    document.getElementById('score2').innerText = `${teams[1]}: ${scores[1]}`;
}

function startTimer() {
    clearInterval(timerInterval);
    let timeLeft = 120;
    const timerEl = document.getElementById('timer');
    timerInterval = setInterval(() => {
        timeLeft--;
        const min = Math.floor(timeLeft/60);
        const sec = timeLeft % 60;
        timerEl.innerText = `${min}:${sec<10?'0':''}${sec}`;
        if (timeLeft <= 0) clearInterval(timerInterval);
    }, 1000);
}

function endRound() {
    clearInterval(timerInterval);
    document.getElementById('screen-game').classList.remove('active');
    document.getElementById('screen-guess').classList.add('active');

    let html = '';
    for (let i = 0; i <= wordsCount; i++) {
        html += `<button onclick="setGuessed(${i})" style="margin:8px; padding:18px 28px; font-size:28px;">${i}</button>`;
    }
    document.getElementById('guess-buttons').innerHTML = html;
}

function setGuessed(num) {
    const opponent = (currentTeamIndex + 1) % 2;
    scores[opponent] += num;
    document.getElementById('guess-buttons').innerHTML = `<h2 style="color:#00ff99;">+${num} очков команде ${teams[opponent]}</h2>`;
}

function nextAfterGuess() {
    document.getElementById('screen-guess').classList.remove('active');
    currentTeamIndex = (currentTeamIndex + 1) % 2;

    if (currentTeamIndex === 0) {
        currentCircle++;
        if (currentCircle > totalRoundsPerType) {
            currentCircle = 1;
            currentRoundType++;
            if (currentRoundType > 3) {
                showEndScreen();
                return;
            }
        }
    }
    document.getElementById('screen-game').classList.add('active');
    nextRound();
}

function showEndScreen() {
    document.getElementById('screen-game').classList.remove('active');
    document.getElementById('screen-guess').classList.remove('active');
    document.getElementById('screen-end').classList.add('active');

    document.getElementById('final-score1').innerText = `${teams[0]}: ${scores[0]}`;
    document.getElementById('final-score2').innerText = `${teams[1]}: ${scores[1]}`;

    const winnerText = scores[0] > scores[1] ? `${teams[0]} победил!` : 
                      scores[1] > scores[0] ? `${teams[1]} победил!` : 'Ничья!';
    document.getElementById('winner').innerText = winnerText;
}

document.getElementById('lang').addEventListener('change', updateLocalization);
updateLocalization();
</script>
